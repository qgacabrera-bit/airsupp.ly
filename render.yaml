services:
  # ==========================================
  # 1. FastAPI Backend Middleware API
  # ==========================================
  - type: web
    name: airsupply-backend
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements-python.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: OPENAQ_API_KEY
        sync: false
      - key: CORS_ORIGINS
        value: "*"
      - key: MONGO_URI
        sync: false
      - key: MONGO_DB_NAME
        value: airsupply_db

  # ==========================================
  # 2. React Vite Progressive Web App (PWA)
  # ==========================================
  - type: web
    name: airsupply-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: airsupply-backend
          property: host
