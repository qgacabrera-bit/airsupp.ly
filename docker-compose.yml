version: '3.8'

services:
  # 1. Apache Kafka in KRaft Mode (No Zookeeper required)
  kafka:
    image: apache/kafka:3.7.2
    container_name: airsupply-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT'
      KAFKA_LISTENERS: 'INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093'
      KAFKA_ADVERTISED_LISTENERS: 'INTERNAL://kafka:29092,EXTERNAL://localhost:9092'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@localhost:9093'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'INTERNAL'
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: '/var/lib/kafka/data'
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    networks:
      - airsupply-net

  # 2. MongoDB 7.0 Storage
  mongodb:
    image: mongo:7.0
    container_name: airsupply-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: airsupply_db
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - airsupply-net

  # 3. Data Ingestion & Fallback Telemetry Producer
  producer:
    build:
      context: .
      dockerfile: Dockerfile.python
    container_name: airsupply-producer
    restart: unless-stopped
    command: python -m producer.producer
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_TOPIC: air_supply_stream
      POLL_INTERVAL_SECONDS: 15
      OPENAQ_BASE_URL: https://api.openaq.org/v3
      OPENAQ_API_KEY: ""
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - airsupply-net

  # 4. PySpark Structured Streaming Pipeline
  spark-streaming:
    build:
      context: .
      dockerfile: spark/Dockerfile
    container_name: airsupply-spark-streaming
    restart: unless-stopped
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_TOPIC: air_supply_stream
      MONGO_URI: mongodb://mongodb:27017
      MONGO_DB_NAME: airsupply_db
      MONGO_LIVE_COLLECTION: live_metrics
      MONGO_HISTORY_COLLECTION: history_logs
      SPARK_CHECKPOINT_DIR: /tmp/spark_checkpoint
    depends_on:
      kafka:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    networks:
      - airsupply-net

  # 5. FastAPI Backend Middleware
  backend:
    build:
      context: .
      dockerfile: Dockerfile.python
    container_name: airsupply-backend
    restart: unless-stopped
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      MONGO_URI: mongodb://mongodb:27017
      MONGO_DB_NAME: airsupply_db
      MONGO_LIVE_COLLECTION: live_metrics
      MONGO_HISTORY_COLLECTION: history_logs
      BACKEND_HOST: 0.0.0.0
      BACKEND_PORT: 8000
      CORS_ORIGINS: "*"
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - airsupply-net

  # 6. React Vite PWA (Nginx Reverse Proxy & Static Host)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: airsupply-frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "5173:80"
    depends_on:
      - backend
    networks:
      - airsupply-net

volumes:
  kafka_data:
    driver: local
  mongo_data:
    driver: local

networks:
  airsupply-net:
    driver: bridge
